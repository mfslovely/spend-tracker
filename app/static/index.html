<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spend Tracker</title>
<style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 16px;color:#172033}form,.card{padding:20px;border:1px solid #d7dce5;border-radius:10px;margin:16px 0}label{display:block;margin:10px 0 4px}input{box-sizing:border-box;width:100%;padding:9px}button{margin-top:16px;padding:10px 16px;background:#1455c0;color:white;border:0;border-radius:6px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}small{color:#a12424}ul{padding-left:20px}.spend{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}</style></head>
<body><h1>Spend Tracker</h1><p>Log an expense and see your totals at a glance.</p>
<form id="expense-form"><div class="grid"><div><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Category</label><input name="category" maxlength="80" placeholder="e.g. Groceries" required></div></div><label>Date</label><input name="date" type="date" required><label>Note <em>(optional)</em></label><input name="note" maxlength="500"><button>Add expense</button> <small id="message"></small></form>
<section class="card"><h2>Summary</h2><p id="total">Loading…</p><div id="categories"></div><div id="recent"></div><div id="mom"></div><div id="insights"></div></section>
<script>
const money = v => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(v);
const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
document.querySelector('[name=date]').value = new Date().toISOString().slice(0,10);
async function loadSummary(){const [summaryResponse,expensesResponse]=await Promise.all([fetch('/summary'),fetch('/expenses')]);const s=await summaryResponse.json();const expenses=await expensesResponse.json();if(!summaryResponse.ok){document.querySelector('#total').textContent=s.error;return}document.querySelector('#total').textContent=`Total spend: ${money(s.total_spend)}`;document.querySelector('#categories').innerHTML='<h3>By category</h3><ul>'+Object.entries(s.spend_by_category).map(([k,v])=>`<li>${escapeHtml(k)}: ${money(v)}</li>`).join('')+'</ul>';document.querySelector('#recent').innerHTML=expenses.length?'<h3>Expenses</h3><ul>'+expenses.map(expense=>`<li>${escapeHtml(expense.category)} — <span class="spend" title="${escapeHtml(expense.note||'No note')}">${money(expense.amount)}</span> <small>${escapeHtml(expense.date)}</small></li>`).join('')+'</ul>':'';document.querySelector('#mom').textContent=`This month: ${money(s.month_over_month.current_month)} · Previous month: ${money(s.month_over_month.previous_month)}${s.month_over_month.percent_change===null?'':` · Change: ${s.month_over_month.percent_change}%`}`;document.querySelector('#insights').innerHTML=s.insights.length?'<h3>Insights</h3><ul>'+s.insights.map(x=>`<li>${escapeHtml(x)}</li>`).join('')+'</ul>':''}
document.querySelector('#expense-form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/expenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await r.json();document.querySelector('#message').textContent=r.ok?'Saved.':body.error;if(r.ok){e.target.reset();document.querySelector('[name=date]').value=new Date().toISOString().slice(0,10);loadSummary()}});loadSummary();
</script></body></html>
